    <text x="300" y="76" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">async-engine.js — Closures &amp; Event Loop</text>
    <text x="135" y="116" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold">class <tspan fill="#38bdf8">EventLoopReactor</tspan> {</text>
    <text x="155" y="140" fill="#94a3b8" font-family="monospace" font-size="12">  #microtasks = new <tspan fill="#38bdf8">Set</tspan>();</text>
    <text x="155" y="164" fill="#94a3b8" font-family="monospace" font-size="12">  async <tspan fill="#f472b6">resolveQueue</tspan>() {</text>
    <text x="175" y="188" fill="#94a3b8" font-family="monospace" font-size="12">    await Promise.all(this.#microtasks);</text>
    <text x="155" y="212" fill="#94a3b8" font-family="monospace" font-size="12">  }</text>
    <text x="135" y="236" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold">}</text>
  </g>
